  <style>
    :root { color-scheme: dark light; --bg: #07090d; --text: #eef1f6; --muted: #808b9e; --accent: #34e5c6; }
    @media (prefers-color-scheme: light) { :root { --bg: #f7f8fa; --text: #0b1220; --muted: #5f6b7d; --accent: #0a7d6e; } }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem;
      background: var(--bg); color: var(--text); text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .code { font: 600 clamp(5rem, 22vw, 10rem)/1 system-ui, sans-serif; letter-spacing: -.06em; margin: 0;
      background: linear-gradient(115deg, #34e5c6, #60a5fa, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: var(--muted); margin: 1rem 0 2rem; }
    a { display: inline-block; padding: .8rem 1.3rem; border-radius: 12px; background: var(--text); color: var(--bg); text-decoration: none; font-weight: 500; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
